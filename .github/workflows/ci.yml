name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_APP_URL: https://oeeoee.com

  # Deploys main to Cloudflare once the repo has CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets (Settings → Secrets and variables → Actions).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_APP_URL: https://oeeoee.com
    steps:
      - name: Skip when Cloudflare secrets are not configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm db:migrate:remote
      - name: Build and deploy the Worker
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm cf:deploy
